name: Reusable Lumi Community Beta release

on:
  workflow_call:
    secrets:
      LUMI_BETA_KEYSTORE_BASE64:
        required: true
      LUMI_BETA_KEYSTORE_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Prepare verified unsigned Beta
    if: ${{ github.repository == 'wxyu71/Lumi_Books' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      verified_sha: ${{ steps.version.outputs.verified_sha }}
    steps:
      - name: Check out the exact verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and publication eligibility
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$VERIFIED_SHA" ]] || exit 1
          echo "verified_sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"

          if [[ "$(git rev-parse origin/main)" != "$VERIFIED_SHA" ]]; then
            echo "Main has advanced; only its latest successful CI may publish."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(sed -n 's/^lumi.communityVersionName=//p' gradle.properties)"
          code="$(sed -n 's/^lumi.communityVersionCode=//p' gradle.properties)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || {
            echo "Only numeric Beta versions can be published" >&2
            exit 1
          }
          [[ "$code" =~ ^[1-9][0-9]*$ ]] || exit 1
          tag="v$version"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version $tag is already published; nothing to do."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag exists without the expected Release; refusing to reuse it" >&2
            exit 1
          fi

          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Prepare Android build toolchain
        if: steps.version.outputs.publish == 'true'
        uses: ./.github/actions/setup-android-toolchain
        with:
          java-version: '21'
          cache-read-only: 'true'

      - name: Build unsigned optimized OSS release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 :app:assembleRelease

      - name: Validate unsigned APK and prepare immutable release input
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/37.0.0"
          shopt -s nullglob
          apks=(app/build/oss/outputs/apk/release/*universal*.apk)
          [[ ${#apks[@]} -eq 1 ]] || {
            echo "Expected exactly one universal Release APK" >&2
            exit 1
          }

          info="$("$sdk/aapt" dump badging "${apks[0]}" | grep '^package:')"
          [[ "$info" == *"name='io.github.wxyu71.lumibooks'"* &&
             "$info" == *"versionCode='$VERSION_CODE'"* &&
             "$info" == *"versionName='$VERSION'"* ]] || {
            echo "APK package or version does not match source" >&2
            exit 1
          }

          mkdir -p release-input
          cp "${apks[0]}" "release-input/Lumi-Community-v$VERSION-universal-unsigned.apk"
          cat > release-input/beta-notes.md <<'NOTES'
          Lumi Community — non-official personal-use Beta built from public OSS sources.

          This APK uses the stable Community Beta signing identity. Newer Betas can
          normally install over older Community Betas when package ID, signature and
          versionCode are compatible. It is not signed by the upstream author.

          Builds using a debug or temporary signing key are not upgrade-compatible:
          back up data before uninstalling those builds and installing this release.

          Verify the downloadable APK using SHA256SUMS.txt.

          ## Changes

          NOTES
          cat app/src/main/assets/changelog.md >> release-input/beta-notes.md

      - name: Upload unsigned release input
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumi-community-release-input
          path: release-input/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Sign and create GitHub Pre-release
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: lumi-community-beta-publish
      cancel-in-progress: false
    steps:
      - name: Set up Java for Android signing tools
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(command -v sdkmanager)"
          fi
          "$sdkmanager" --install "build-tools;37.0.0"

      - name: Download verified unsigned release input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lumi-community-release-input
          path: release-input

      - name: Confirm the verified commit is still main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.build.outputs.verified_sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current" == "$VERIFIED_SHA" ]] || {
            echo "Main advanced after the verified build; refusing a stale publication." >&2
            exit 1
          }

      - name: Sign with the stable Community Beta identity and verify
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_CODE: ${{ needs.build.outputs.code }}
          LUMI_BETA_KEYSTORE_BASE64: ${{ secrets.LUMI_BETA_KEYSTORE_BASE64 }}
          LUMI_BETA_KEYSTORE_PASSWORD: ${{ secrets.LUMI_BETA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$LUMI_BETA_KEYSTORE_BASE64" && -n "$LUMI_BETA_KEYSTORE_PASSWORD" ]] || {
            echo "Configure both Community Beta signing secrets before publishing" >&2
            exit 1
          }

          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/37.0.0"
          unsigned="release-input/Lumi-Community-v$VERSION-universal-unsigned.apk"
          test -s "$unsigned"

          umask 077
          store="$RUNNER_TEMP/lumi-community-release.p12"
          aligned="$RUNNER_TEMP/lumi-community-aligned.apk"
          trap 'rm -f "$store" "$aligned"' EXIT
          printf '%s' "$LUMI_BETA_KEYSTORE_BASE64" | base64 --decode > "$store"
          test -s "$store"

          "$sdk/zipalign" -f -p 4 "$unsigned" "$aligned"
          mkdir -p dist
          name="Lumi-Community-v$VERSION-universal.apk"
          "$sdk/apksigner" sign --ks "$store" --ks-type PKCS12 \
            --ks-key-alias lumi-community \
            --ks-pass env:LUMI_BETA_KEYSTORE_PASSWORD \
            --key-pass env:LUMI_BETA_KEYSTORE_PASSWORD \
            --out "dist/$name" "$aligned"

          "$sdk/apksigner" verify --verbose --print-certs "dist/$name"
          info="$("$sdk/aapt" dump badging "dist/$name" | grep '^package:')"
          [[ "$info" == *"name='io.github.wxyu71.lumibooks'"* &&
             "$info" == *"versionCode='$VERSION_CODE'"* &&
             "$info" == *"versionName='$VERSION'"* ]] || exit 1

          (cd dist && sha256sum "$name" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)

      - name: Create version tag and GitHub Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          VERIFIED_SHA: ${{ needs.build.outputs.verified_sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current" == "$VERIFIED_SHA" ]] || {
            echo "Main advanced during signing; refusing a stale publication." >&2
            exit 1
          }

          gh release create "$TAG" \
            "dist/Lumi-Community-v$VERSION-universal.apk" \
            "dist/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VERIFIED_SHA" \
            --prerelease \
            --title "Lumi Community $VERSION (Beta)" \
            --notes-file release-input/beta-notes.md
