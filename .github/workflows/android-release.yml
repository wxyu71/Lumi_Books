name: Publish signed Lumi Community Beta

on:
  push:
    tags:
      - 'v*-beta.*'

# Tag publication is isolated from PR checks and secrets.
permissions:
  contents: read

jobs:
  full-ci:
    name: Full required Android verification
    uses: ./.github/workflows/android-beta.yml
    permissions:
      contents: read

  publish:
    name: Sign and publish GitHub Pre-release
    needs: full-ci
    if: ${{ github.repository == 'wxyu71/Lumi_Books' && needs.full-ci.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    environment: beta-release
    permissions:
      contents: write
    concurrency:
      group: lumi-community-beta-publication
      cancel-in-progress: false
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a version-matching tag already merged to main
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF_TYPE" == tag && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || exit 1
          version="$(sed -n 's/^lumi.communityVersionName=//p' gradle.properties)"
          code="$(sed -n 's/^lumi.communityVersionCode=//p' gradle.properties)"
          [[ "$tag" == "v$version" && "$code" =~ ^[0-9]+$ ]] || exit 1
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Tag is not contained in main" >&2
            exit 1
          }
          echo "BETA_TAG=$tag" >> "$GITHUB_ENV"
          echo "BETA_VERSION=$version" >> "$GITHUB_ENV"
          echo "BETA_CODE=$code" >> "$GITHUB_ENV"

      - name: Set up Android toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          java-version: '21'
          cache-read-only: 'true'

      - name: Load the protected signing identity
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMI_BETA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LUMI_BETA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUMI_BETA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUMI_BETA_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.LUMI_BETA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" &&
             -n "$KEY_PASSWORD" && -n "$EXPECTED_CERT" ]] || {
            echo "Configure signing secrets and certificate pin in the beta-release environment" >&2
            exit 1
          }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumi-beta.jks"
          echo "LUMI_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/lumi-beta.jks" >> "$GITHUB_ENV"
          echo "LUMI_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LUMI_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LUMI_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release signed with the community identity
        shell: bash
        run: |
          set -euo pipefail
          test ! -d app/src/premium/java
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK identity, signature and SHA-256
        shell: bash
        env:
          EXPECTED_CERT: ${{ vars.LUMI_BETA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/37.0.0"
          shopt -s nullglob
          apks=(app/build/oss/outputs/apk/release/*universal*release.apk)
          [[ ${#apks[@]} -eq 1 ]] || { echo "Expected one universal release APK" >&2; exit 1; }
          apk="${apks[0]}"
          info="$("$sdk/aapt" dump badging "$apk" | grep '^package:')"
          [[ "$info" == *"name='io.github.wxyu71.lumibooks'"* &&
             "$info" == *"versionCode='$BETA_CODE'"* &&
             "$info" == *"versionName='$BETA_VERSION'"* ]] || exit 1
          signature="$("$sdk/apksigner" verify --verbose --print-certs "$apk")"
          echo "$signature" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
          actual="$(printf '%s\n' "$signature" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
          expected="$(printf '%s' "$EXPECTED_CERT" | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          [[ "$actual" =~ ^[a-f0-9]{64}$ && "$actual" == "$expected" ]] || {
            echo "Signing certificate differs from the pinned community identity" >&2; exit 1;
          }
          mkdir -p dist
          filename="Lumi-Community-v$BETA_VERSION-universal.apk"
          cp "$apk" "dist/$filename"
          (cd dist && sha256sum "$filename" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          echo "Signed Beta $BETA_TAG; versionCode $BETA_CODE; verified APK SHA-256 and certificate $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the verified GitHub Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$BETA_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace public assets" >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/beta-notes.md" <<'NOTES'
          Non-official Lumi Community Beta, built from the public OSS source.
          Includes community tag management, opt-in local reading journal and TXT/Markdown annotation exports.
          No private Premium services. This is pre-release software, separate from Huangder's original app.
          Verify the APK against SHA256SUMS.txt. Future Community Beta updates require the same signing identity.
          NOTES
          gh release create "$BETA_TAG" \
            "dist/Lumi-Community-v$BETA_VERSION-universal.apk" \
            "dist/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease \
            --title "Lumi Community $BETA_VERSION (Beta)" \
            --notes-file "$RUNNER_TEMP/beta-notes.md"
