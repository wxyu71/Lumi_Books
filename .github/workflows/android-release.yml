name: Publish personal Lumi Community Beta

# Publish once when a new version has passed normal main-branch CI.
# PRs never receive release write permissions. No separate CI rerun or tag push.
on:
  workflow_run:
    workflows: ['Android Community Beta']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Create GitHub Beta Pre-release
    if: ${{ github.repository == 'wxyu71/Lumi_Books' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
    concurrency:
      group: lumi-personal-beta-publish
      cancel-in-progress: false
    steps:
      - name: Check out the exact main CI commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check version and skip previously published versions
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$VERIFIED_SHA" ]] || exit 1
          if [[ "$(git rev-parse origin/main)" != "$VERIFIED_SHA" ]]; then
            echo "Main has advanced; only its latest CI can publish a new Beta."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(sed -n 's/^lumi.communityVersionName=//p' gradle.properties)"
          code="$(sed -n 's/^lumi.communityVersionCode=//p' gradle.properties)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || {
            echo "Only numeric Beta versions can be published" >&2; exit 1;
          }
          [[ "$code" =~ ^[1-9][0-9]*$ ]] || exit 1
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version $tag is already published; nothing to do."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag exists without the expected Release; do not reuse it" >&2
            exit 1
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Prepare Android build tools
        if: steps.version.outputs.publish == 'true'
        uses: ./.github/actions/setup-android-toolchain
        with:
          java-version: '21'
          cache-read-only: 'true'

      - name: Build unsigned, optimized OSS release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test ! -d app/src/premium/java
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Sign with an ephemeral personal-preview identity and verify
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/37.0.0"
          shopt -s nullglob
          apks=(app/build/oss/outputs/apk/release/*universal*.apk)
          [[ ${#apks[@]} -eq 1 ]] || {
            echo "Expected exactly one universal Release APK" >&2; exit 1;
          }
          apk="${apks[0]}"
          info="$("$sdk/aapt" dump badging "$apk" | grep '^package:')"
          [[ "$info" == *"name='io.github.wxyu71.lumibooks'"* &&
             "$info" == *"versionCode='$VERSION_CODE'"* &&
             "$info" == *"versionName='$VERSION'"* ]] || {
            echo "APK package or version does not match source" >&2; exit 1;
          }
          umask 077
          pass="$(openssl rand -hex 24)"
          store="$RUNNER_TEMP/lumi-personal-beta.jks"
          trap 'rm -f "$store" "$RUNNER_TEMP/lumi-aligned.apk"' EXIT
          keytool -genkeypair -noprompt -keystore "$store" \
            -alias lumi-preview -keyalg RSA -keysize 3072 -validity 3650 \
            -storepass "$pass" -keypass "$pass" \
            -dname "CN=Lumi Community Personal Preview"
          "$sdk/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/lumi-aligned.apk"
          mkdir -p dist
          name="Lumi-Community-v$VERSION-universal.apk"
          "$sdk/apksigner" sign --ks "$store" --ks-key-alias lumi-preview \
            --ks-pass "pass:$pass" --key-pass "pass:$pass" \
            --out "dist/$name" "$RUNNER_TEMP/lumi-aligned.apk"
          "$sdk/apksigner" verify --verbose --print-certs "dist/$name"
          (cd dist && sha256sum "$name" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          echo "Personal Beta $VERSION: unsigned release build signed once for this distribution; the next Beta is NOT an in-place APK update." >> "$GITHUB_STEP_SUMMARY"

      - name: Create the Pre-release and version tag automatically
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$VERIFIED_SHA" ]]; then
            echo "Main advanced during packaging; skip stale publication."
            exit 0
          fi
          cat > "$RUNNER_TEMP/beta-notes.md" <<'NOTES'
          Lumi Community — non-official personal-use Beta built from public OSS sources.

          This Beta APK is signed with a newly generated temporary key, not the original author's key.
          IMPORTANT: Future Beta APKs use a different key and CANNOT be installed over this app.
          Back up your reading data inside the app before uninstalling an older Beta;
          uninstalling normally removes its private app data. Then install the new Beta.
          This is intended for personal testing, not an automatically upgradable app distribution.

          Verify the downloadable APK using SHA256SUMS.txt.
          NOTES
          printf '\n## Changes\n\n' >> "$RUNNER_TEMP/beta-notes.md"
          cat app/src/main/assets/changelog.md >> "$RUNNER_TEMP/beta-notes.md"
          gh release create "$TAG" \
            "dist/Lumi-Community-v$VERSION-universal.apk" "dist/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$VERIFIED_SHA" \
            --prerelease --title "Lumi Community $VERSION (personal Beta)" \
            --notes-file "$RUNNER_TEMP/beta-notes.md"
