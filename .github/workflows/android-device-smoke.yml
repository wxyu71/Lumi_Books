name: Android device smoke and manual benchmark

on:
  schedule:
    # Nightly emulator use is expensive; run one weekly diagnostic on default main.
    - cron: '47 5 * * 0'
  workflow_dispatch:
    inputs:
      run_macrobenchmarks:
        description: 'Also run full reader Macrobenchmark suite (expensive; emulator numbers informational)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-device-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    name: Emulator API 35 UI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper and restore cache
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-read-only: true

      - name: Install community Android build toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then sdkmanager="$(command -v sdkmanager)"; fi
          "$sdkmanager" --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"
          chmod +x ./gradlew
          python3 tools/check_community_policy.py

      - name: Enable KVM for hardware-accelerated emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run targeted Android UI tests (and optional Macrobenchmark)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            timeout --signal=TERM --kill-after=30s 35m \
              ./gradlew --no-daemon --console=plain --stacktrace :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.huangder.lumibooks.data.local.dao.FolderDaoTest,com.huangder.lumibooks.ui.components.LiquidGlassButtonInteractionInstrumentedTest
            if [[ "${{ inputs.run_macrobenchmarks }}" == "true" ]]; then
              timeout --signal=TERM --kill-after=30s 40m \
                ./gradlew --no-daemon --console=plain --stacktrace :benchmark:connectedBenchmarkAndroidTest \
                -Pandroid.testInstrumentationRunnerArguments.class=com.huangder.lumibooks.benchmark.ReaderMacrobenchmark
            fi

      - name: Upload device reports and benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Lumi-Community-Device-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/oss/reports/androidTests/
            app/build/oss/outputs/androidTest-results/
            benchmark/build/reports/androidTests/
            benchmark/build/outputs/androidTest-results/
            benchmark/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 14
