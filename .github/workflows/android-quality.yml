name: Weekly Android quality baseline

on:
  schedule:
    - cron: '13 6 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Android Lint (baseline monitoring)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout public community source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Android toolchain
        uses: ./.github/actions/setup-android-toolchain
        with:
          java-version: '17'
          cache-read-only: 'true'
      - name: Run official Android Lint without skipping findings
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          timeout --signal=TERM --kill-after=30s 32m \
            ./gradlew --no-daemon --console=plain --stacktrace :app:lintDebug
      - name: Upload Lint HTML, XML and text reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lumi-Community-AndroidLint-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/oss/reports/lint-results-*
            app/build/oss/intermediates/lint*
          if-no-files-found: warn
          retention-days: 14
