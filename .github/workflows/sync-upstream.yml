name: Sync upstream with Community safety gate

on:
  schedule:
    - cron: '23 4 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    # Never give a review branch or an upstream PR a write-capable automation token.
    if: github.ref == 'refs/heads/main' && github.repository == 'wxyu71/Lumi_Books'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout community main with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Merge, protect Community edits, validate, and promote or propose a PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci_sync_upstream.sh
