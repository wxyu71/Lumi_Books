name: Propose upstream sync

on:
  schedule:
    - cron: '23 4 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout community main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream main (never merge automatically)
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/huangder/Lumi_Books.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "No new upstream changes" >> "$GITHUB_STEP_SUMMARY"
            echo "UPSTREAM_CHANGED=false" >> "$GITHUB_ENV"
          else
            echo "UPSTREAM_CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Update upstream review branch
        if: env.UPSTREAM_CHANGED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git switch -C sync/upstream-main upstream/main
          git push --force origin HEAD:refs/heads/sync/upstream-main

      - name: Propose review PR
        if: env.UPSTREAM_CHANGED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --base main --head sync/upstream-main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "Updated review branch for PR #$existing" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --draft --base main --head sync/upstream-main \
              --title "chore: review upstream Lumi_Books changes" \
              --body "Automated upstream review proposal; **not** an automatic merge. Reconcile conflicts and preserve community product decisions (no Premium, QQ, remote notice fetch, mandatory onboarding, widgets). CI and manual code review are required."
          fi
          echo "Do not merge this raw tracking branch without reconciling community changes." >> "$GITHUB_STEP_SUMMARY"
