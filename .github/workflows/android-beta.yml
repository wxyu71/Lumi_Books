name: Android Community Beta

on:
  push:
    branches:
      - main
  # Community feature branches are already validated through PRs; avoid duplicate
  # push+PR runs that cancel one another before producing reusable Gradle caches.
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an unpublished Beta after all main checks pass
        required: false
        type: boolean
        default: false

# Untrusted pull requests never gain write permissions, tokens or signing keys.
permissions:
  contents: read

concurrency:
  group: android-beta-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint + ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
              -shellcheck='shellcheck -S warning' -color
          shellcheck --severity=warning tools/ci_run_device_smoke.sh tools/ci_sync_upstream.sh

      - name: Audit GitHub Actions security with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1 / zizmor 1.32
        with:
          advanced-security: false
          annotations: true
          online-audits: false
          min-severity: medium

      - name: Lint maintained Markdown
        uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          globs: |
            README*.md
            AGENTS.md
            COMMUNITY.md
            CONTRIBUTING.md
            SECURITY.md
            docs/**/*.md
            app/src/main/assets/changelog.md

      - name: Check local documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --exclude-path '(^|/)skills/' --exclude-path '(^|/)third_party/' './**/*.md'
          fail: true
          failIfEmpty: false

  verify:
    name: JVM compile + Robolectric (JDK 21)
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android Gradle toolchain (JDK 21)
        uses: ./.github/actions/setup-android-toolchain
        with:
          java-version: '21'
          # Only trusted same-repo PRs or main builds write a Gradle cache.
          # Fork PRs read only; GitHub scopes each PR cache to refs/pull/N/merge.
          cache-read-only: 'true'

      # Resolve external dependencies with bounded retry, following the same pattern
      # used by AnkiDroid: network/bootstrap failures may retry, compilation and tests do not.
      - name: Resolve Gradle and Robolectric dependencies with bounded retry
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          retry_wait_seconds: 60
          max_attempts: 3
          command: >
            ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2
            :app:robolectricSdkDownload

      # Check source/test compilation only after the dependency/bootstrap stage is ready.
      # Real compilation failures are terminal and are never retried.
      - name: Compile app, JVM and instrumentation test sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-logs/compile
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 \
            :app:compileDebugKotlin :app:compileDebugUnitTestKotlin :app:compileDebugAndroidTestKotlin \
            2>&1 | tee test-logs/compile/gradle.log

      - name: Smoke-test Robolectric API 33 runtime
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 \
            :app:testDebugUnitTest \
            --tests 'com.huangder.lumibooks.ui.reader.ReaderImageAdjustmentsTest.flatImagesKeepTheirColorIncludingBorders'

      - name: Run the complete Android 13+ JVM suite
        id: jvm_test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-logs/jvm
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 \
            :app:testDebugUnitTest 2>&1 | tee test-logs/jvm/gradle.log

      - name: Publish native JUnit results
        if: ${{ always() && !cancelled() && steps.jvm_test.outcome != 'skipped' }}
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        with:
          report_paths: app/build/oss/test-results/testDebugUnitTest/TEST-*.xml
          annotate_only: true
          skip_annotations: true
          require_tests: true
          fail_on_parse_error: true
          fail_on_failure: false
          detailed_summary: true
          failed_summary_logs: true

      - name: Upload native JVM XML, HTML and Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lumi-Community-JVM-all-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/oss/test-results/testDebugUnitTest/
            app/build/oss/reports/tests/testDebugUnitTest/
            test-logs/
          if-no-files-found: warn
          retention-days: 14


  quality:
    name: Android Lint — zero errors
    needs: [policy, verify]
    if: ${{ needs.policy.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android Gradle toolchain (JDK 21)
        uses: ./.github/actions/setup-android-toolchain
        with:
          java-version: '21'
          cache-read-only: 'true'

      - name: Full Android Lint — zero errors required
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-logs/lint
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 \
            :app:lintDebug 2>&1 | tee test-logs/lint/gradle.log

      - name: Upload Lint reports (including failures)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lumi-Community-Lint-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/oss/reports/lint-results*
            test-logs/lint/
          if-no-files-found: warn
          retention-days: 14

  apk:
    name: Debug APK package + metadata
    needs: [policy, verify, quality]
    if: ${{ needs.policy.result == 'success' && needs.verify.result == 'success' && needs.quality.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android Gradle toolchain (JDK 21)
        uses: ./.github/actions/setup-android-toolchain
        with:
          java-version: '21'
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

# P3 starts only after compile, Robolectric/JVM and Android Lint have passed.
      - name: Assemble debug-signed community APK after JVM passes
        id: build_apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-logs/apk
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 \
            :app:assembleDebug 2>&1 | tee test-logs/apk/gradle.log

      - name: Verify APK metadata and create SHA-256 checksums
        id: apk_metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^lumi.communityVersionName=//p' gradle.properties)"
          version_code="$(sed -n 's/^lumi.communityVersionCode=//p' gradle.properties)"
          test -n "$version"
          test -n "$version_code"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          aapt="$sdk_root/build-tools/37.0.0/aapt"
          apksigner="$sdk_root/build-tools/37.0.0/apksigner"
          test -x "$aapt"
          test -x "$apksigner"
          mkdir -p dist
          shopt -s nullglob
          apks=(app/build/oss/outputs/apk/debug/*.apk)
          # PR artifacts should be quick to download; keep architecture-specific
          # APKs for main/manual builds and provide one universal APK for review.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            apks=(app/build/oss/outputs/apk/debug/*universal*.apk)
          fi
          if (( ${#apks[@]} == 0 )); then
            echo "No OSS debug APKs found" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            metadata="$("$aapt" dump badging "$apk" | grep '^package:')"
            [[ "$metadata" == *"name='io.github.wxyu71.lumibooks'"* ]] || { echo "$metadata" >&2; exit 1; }
            [[ "$metadata" == *"versionName='$version'"* ]] || { echo "$metadata" >&2; exit 1; }
            [[ "$metadata" == *"versionCode='$version_code'"* ]] || { echo "$metadata" >&2; exit 1; }
            "$apksigner" verify --verbose --print-certs "$apk" > "dist/signature-$(basename "$apk").txt"
            grep -q "Android Debug" "dist/signature-$(basename "$apk").txt" || {
              echo "::error::Community APK must be signed only with an Android Debug certificate" >&2
              exit 1
            }
            cp "$apk" "dist/Lumi-Community-$version-$(basename "$apk")"
          done
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          {
            echo "### Community Beta APKs"
            echo "Version: \`$version\` / code \`$version_code\`"
            echo "Debug builds are signed with CI's temporary debug key; they are not stable release-signed builds."
            echo
            echo '```'
            ls -lh dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failed APK Gradle diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lumi-Community-APK-failure-${{ github.run_number }}-${{ github.run_attempt }}
          path: test-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installable debug APKs
        if: ${{ steps.apk_metadata.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lumi-Community-Beta-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14



  diagnostic:
    name: Diagnostic build
    needs: [policy, verify, quality]
    if: ${{ needs.policy.result == 'success' && needs.verify.result == 'success' && needs.quality.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Android Gradle toolchain (JDK 21)
        uses: ./.github/actions/setup-android-toolchain
        with:
          java-version: '21'
          cache-read-only: 'true'
      - name: Assemble diagnostic independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-logs/diagnostic
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 \
            :app:assembleDiagnostic 2>&1 | tee test-logs/diagnostic/gradle.log
          find app/build/oss/outputs/apk/diagnostic -name '*.apk' -type f | grep -q '.'
      - name: Upload diagnostic build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lumi-Community-Diagnostic-${{ github.run_number }}-${{ github.run_attempt }}
          path: test-logs/diagnostic/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Unsigned Release build
    needs: [policy, verify, quality]
    if: ${{ needs.policy.result == 'success' && needs.verify.result == 'success' && needs.quality.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android Gradle toolchain (JDK 21)
        uses: ./.github/actions/setup-android-toolchain
        with:
          java-version: '21'
          cache-read-only: 'true'

      - name: Assemble unsigned release independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-logs/release
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 \
            :app:assembleRelease 2>&1 | tee test-logs/release/gradle.log

      - name: Verify release metadata and prepare immutable publish input
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^lumi.communityVersionName=//p' gradle.properties)"
          version_code="$(sed -n 's/^lumi.communityVersionCode=//p' gradle.properties)"
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/37.0.0"
          shopt -s nullglob
          apks=(app/build/oss/outputs/apk/release/*universal*.apk)
          [[ ${#apks[@]} -eq 1 ]] || {
            echo "Expected exactly one universal Release APK, found ${#apks[@]}" >&2
            exit 1
          }

          info="$("$sdk/aapt" dump badging "${apks[0]}" | grep '^package:')"
          [[ "$info" == *"name='io.github.wxyu71.lumibooks'"* &&
             "$info" == *"versionCode='$version_code'"* &&
             "$info" == *"versionName='$version'"* ]] || {
            echo "$info" >&2
            exit 1
          }

          mkdir -p release-input
          cp "${apks[0]}" "release-input/Lumi-Community-v$version-universal-unsigned.apk"
          cat > release-input/beta-notes.md <<'NOTES'
          Lumi Community — non-official personal-use Beta built from public OSS sources.

          This APK uses the stable Community Beta signing identity. Newer Betas can
          normally install over older Community Betas when package ID, signature and
          versionCode are compatible. It is not signed by the upstream author.

          Builds using a debug or temporary signing key are not upgrade-compatible:
          back up data before uninstalling those builds and installing this release.

          Verify the downloadable APK using SHA256SUMS.txt.

          ## Changes

          NOTES
          cat app/src/main/assets/changelog.md >> release-input/beta-notes.md

      - name: Upload release build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lumi-Community-Release-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            test-logs/release/
            app/build/oss/outputs/mapping/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload immutable unsigned Beta input for same-run publication
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumi-community-unsigned-release
          path: release-input/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  device-smoke:
    name: Emulator API ${{ matrix.api }} integration + UI + screenshots
    needs: [policy, verify, quality, apk, diagnostic, release]
    if: ${{ needs.policy.result == 'success' && needs.verify.result == 'success' && needs.quality.result == 'success' && needs.apk.result == 'success' && needs.diagnostic.result == 'success' && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        api: [33, 35]
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android Gradle toolchain (JDK 21)
        uses: ./.github/actions/setup-android-toolchain
        with:
          java-version: '21'
          cache-read-only: 'true'

      # Compile/package before booting the emulator: compiler failures must not
      # consume device runtime or masquerade as Android rendering failures.
      - name: Prepare instrumentation APK before emulator boot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-logs/device
          ./gradlew --no-daemon --console=plain --stacktrace --max-workers=2 \
            :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee test-logs/device/prepare-apk.log

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run blocking integration/UI/screenshot tests
        id: device_tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci_run_device_smoke.sh

      - name: Publish native instrumentation JUnit results
        if: ${{ always() && !cancelled() && steps.device_tests.outcome != 'skipped' }}
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        with:
          report_paths: app/build/oss/outputs/androidTest-results/**/*.xml
          annotate_only: true
          skip_annotations: true
          require_tests: true
          fail_on_parse_error: true
          fail_on_failure: false
          detailed_summary: true
          failed_summary_logs: true

      - name: Upload AndroidTest JUnit, logcat and UI screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lumi-Community-Emulator-API${{ matrix.api }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/oss/outputs/androidTest-results/
            app/build/oss/reports/androidTests/
            test-logs/device/
          if-no-files-found: warn
          retention-days: 14


  ci-gate:
    name: Required CI summary
    if: always()
    needs: [policy, verify, quality, apk, diagnostic, release, device-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all required checks passed
        shell: bash
        env:
          POLICY: ${{ needs.policy.result }}
          VERIFY: ${{ needs.verify.result }}
          QUALITY: ${{ needs.quality.result }}
          APK: ${{ needs.apk.result }}
          DIAGNOSTIC: ${{ needs.diagnostic.result }}
          RELEASE: ${{ needs.release.result }}
          DEVICE: ${{ needs.device-smoke.result }}
        run: |
          set -euo pipefail
          {
            echo "### Lumi Community CI"
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Repository static analysis | $POLICY |"
            echo "| Kotlin/test compile + Robolectric API 33/35/36 JVM scope | $VERIFY |"
            echo "| Android Lint (zero errors) | $QUALITY |"
            echo "| Debug APK + metadata/SHA-256 | $APK |"
            echo "| Diagnostic build | $DIAGNOSTIC |"
            echo "| Unsigned Release build | $RELEASE |"
            echo "| Emulator API 33 + 35 integration/UI/screenshot | $DEVICE |"
            echo
            echo "PR JVM scope is Android 13+ (API 33/35/36). Historical explicit SDK cases are covered by the weekly legacy workflow using the same Gradle test task."
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$POLICY" == success && "$VERIFY" == success && "$QUALITY" == success && "$APK" == success && "$DIAGNOSTIC" == success && "$RELEASE" == success && "$DEVICE" == success ]]


  publish-beta:
    name: Publish Beta from verified main
    needs: [ci-gate]
    if: ${{ github.ref == 'refs/heads/main' && needs.ci-gate.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/android-release.yml
    secrets:
      LUMI_BETA_KEYSTORE_BASE64: ${{ secrets.LUMI_BETA_KEYSTORE_BASE64 }}
      LUMI_BETA_KEYSTORE_PASSWORD: ${{ secrets.LUMI_BETA_KEYSTORE_PASSWORD }}
